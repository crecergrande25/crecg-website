<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>Reset Password | Crecer Grande</title><link rel="stylesheet" href="assets/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/runtime-config.js"></script></head><body><div class="login"><form id="reset" class="login-card"><img src="../assets/images/logo.png"><h1>Set new password</h1><label>New password<input id="p1" type="password" minlength="10" required></label><label>Confirm password<input id="p2" type="password" minlength="10" required></label><button class="primary">Update password</button><div id="s" class="status hidden"></div></form></div><script>const cfg=window.CG_CONFIG||{},c=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;document.getElementById('reset').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('s'),a=p1.value,b=p2.value;s.classList.remove('hidden');if(!c)return s.textContent='Supabase is not configured.';if(a!==b)return s.textContent='Passwords do not match.';const r=await c.auth.updateUser({password:a});if(r.error)return s.textContent=r.error.message;try{await c.rpc('complete_password_change')}catch(x){}s.textContent='Password updated. You can return to Admin.'}</script></body></html>
