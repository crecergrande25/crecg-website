<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Admin Password | Crecer Grande</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../assets/css/site.css"><link rel="stylesheet" href="../assets/css/admin-v193.css"></head><body class="cg-admin-body"><section class="cg-login-wrap"><div class="cg-login-card"><img src="../assets/images/logo.png" alt="Crecer Grande" style="width:240px;max-width:80%"><div class="admin-kicker">ACCOUNT SECURITY</div><h1>Set a new password</h1><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="10" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="10" required></label><button class="admin-primary" type="submit">Update password</button><div id="resetMsg" class="admin-msg"></div></form><p class="admin-login-note">If you did not arrive here through an authorised recovery session, use the Admin Center or contact the Super Admin.</p></div></section><script src="../assets/js/cg-config.js"></script><script src="../assets/js/cg-backend.js"></script><script>document.getElementById('resetForm').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('resetMsg'),p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c){m.textContent='Passwords do not match.';return}try{await CGBackend.updatePassword(p);m.textContent='Password updated. You can return to Admin Login.'}catch(err){m.textContent=err.message}});</script></body></html>
